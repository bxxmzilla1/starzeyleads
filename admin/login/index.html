<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Starzey Admin</title>
<meta name="theme-color" content="#EEF5FB">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="auth-loading">

<div class="auth-wrap">
  <div class="auth-card">
    <a class="logo" href="/" aria-label="Starzey home">
      <span class="logo-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E86D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5.5h4v5.5"/>
        </svg>
      </span>
      <span class="logo-name">Starzey</span>
    </a>

    <h1 class="auth-title" id="authTitle">Welcome back</h1>
    <p class="auth-sub" id="authSub">Sign in to manage your tracking links and leads.</p>

    <div class="auth-tabs" role="tablist" aria-label="Sign in or create account">
      <button type="button" id="tabSignIn" class="active" role="tab" aria-selected="true">Sign in</button>
      <button type="button" id="tabSignUp" role="tab" aria-selected="false">Create account</button>
    </div>

    <div class="auth-msg" id="authMsg" role="status"></div>

    <form id="authForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary" id="authSubmit" style="width:100%;margin-top:6px">Sign in</button>
    </form>
  </div>
</div>

<script src="/api/config"></script>
<script src="/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/store.js"></script>
<script>
(function () {
  "use strict";

  var tabSignIn = document.getElementById("tabSignIn");
  var tabSignUp = document.getElementById("tabSignUp");
  var authTitle = document.getElementById("authTitle");
  var authSub = document.getElementById("authSub");
  var authMsg = document.getElementById("authMsg");
  var authForm = document.getElementById("authForm");
  var authSubmit = document.getElementById("authSubmit");
  var emailInput = document.getElementById("email");
  var passwordInput = document.getElementById("password");

  var mode = "signin";

  /* Config missing → explain setup instead of a dead form. */
  if (!StarzeyStore.isConfigured()) {
    showMsg("error",
      "Supabase isn't configured yet. Paste your project URL and anon key " +
      "into assets/config.js and run supabase/schema.sql in the SQL Editor.");
    authSubmit.disabled = true;
  }

  /* Already signed in → straight to the dashboard (the form stays
     hidden until the session check completes, to avoid a flash). */
  StarzeyStore.getSession().then(function (session) {
    if (session) {
      location.href = "/admin/";
      return;
    }
    document.body.classList.remove("auth-loading");
  });

  function setMode(next) {
    mode = next;
    var signin = mode === "signin";
    tabSignIn.classList.toggle("active", signin);
    tabSignUp.classList.toggle("active", !signin);
    tabSignIn.setAttribute("aria-selected", signin);
    tabSignUp.setAttribute("aria-selected", !signin);
    authTitle.textContent = signin ? "Welcome back" : "Create your account";
    authSub.textContent = signin
      ? "Sign in to manage your tracking links and leads."
      : "Set up an account to access the Starzey admin.";
    authSubmit.textContent = signin ? "Sign in" : "Create account";
    passwordInput.setAttribute("autocomplete", signin ? "current-password" : "new-password");
    hideMsg();
  }

  tabSignIn.addEventListener("click", function () { setMode("signin"); });
  tabSignUp.addEventListener("click", function () { setMode("signup"); });

  function showMsg(kind, text) {
    authMsg.className = "auth-msg " + kind;
    authMsg.textContent = text;
  }

  function hideMsg() {
    authMsg.className = "auth-msg";
    authMsg.textContent = "";
  }

  function flagInvalid(input) {
    input.classList.add("invalid");
    input.focus();
    input.addEventListener("input", function handler() {
      input.classList.remove("invalid");
      input.removeEventListener("input", handler);
    });
  }

  authForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!StarzeyStore.isConfigured()) return;

    var email = emailInput.value.trim();
    var password = passwordInput.value;
    var ok = true;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { flagInvalid(emailInput); ok = false; }
    if (password.length < 6) { flagInvalid(passwordInput); ok = false; }
    if (!ok) return;

    authSubmit.disabled = true;
    authSubmit.textContent = mode === "signin" ? "Signing in…" : "Creating account…";
    hideMsg();

    var action = mode === "signin"
      ? StarzeyStore.signIn(email, password)
      : StarzeyStore.signUp(email, password);

    action.then(function (data) {
      if (data.session) {
        location.href = "/admin/";
        return;
      }
      /* Sign-up with email confirmation enabled: no session yet. */
      showMsg("ok", "Account created. Check your inbox to confirm your email, then sign in.");
      setModeButtonsIdle();
      setMode("signin");
    }).catch(function (err) {
      showMsg("error", err.message || "Something went wrong. Please try again.");
      setModeButtonsIdle();
    });

    function setModeButtonsIdle() {
      authSubmit.disabled = false;
      authSubmit.textContent = mode === "signin" ? "Sign in" : "Create account";
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
