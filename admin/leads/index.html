<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — Starzey Admin</title>
<meta name="theme-color" content="#EEF5FB">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="auth-loading">
<div class="app">

  <aside class="sidebar">
    <a class="logo" href="/admin/" aria-label="Starzey admin home">
      <span class="logo-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E86D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5.5h4v5.5"/>
        </svg>
      </span>
      <span class="logo-name">Starzey</span>
    </a>

    <nav class="nav" aria-label="Admin sections">
      <a href="/admin/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="/admin/trackinglinks/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        Tracking links
      </a>
      <a href="/admin/leads/" class="active" aria-current="page">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Leads
      </a>
      <button type="button" id="signOut">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </nav>

    <div class="sidebar-foot">
      Public page: <a href="/" target="_blank" rel="noopener">starzey.com</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>Leads</h1>
      <p>Everyone who completed the home valuation funnel, with the tracking link they came from.</p>
    </div>

    <div class="card">
      <div class="preview-head">
        <h2 style="margin-bottom:0">All leads <span class="pill" id="leadCount">0</span></h2>
        <button type="button" class="btn btn-ghost btn-small" id="exportCsv">Export CSV</button>
      </div>
      <div id="leadsWrap"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="/api/config"></script>
<script src="/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/store.js"></script>
<script>
(function () {
  "use strict";

  var allLeads = [];

  var leadsWrap = document.getElementById("leadsWrap");
  var leadCount = document.getElementById("leadCount");
  var toast = document.getElementById("toast");
  var toastTimer = null;

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  function esc(text) {
    var div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
  }

  function formatPhone(digits) {
    if (!digits || digits.length !== 10) return digits || "";
    return "(" + digits.slice(0, 3) + ") " + digits.slice(3, 6) + "-" + digits.slice(6);
  }

  function formatDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
      " · " + new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function refresh() {
    return StarzeyStore.getLeads().then(function (leads) {
      allLeads = leads;
      render();
    });
  }

  function render() {
    var leads = allLeads.slice().reverse();
    leadCount.textContent = leads.length;

    if (leads.length === 0) {
      leadsWrap.innerHTML =
        '<div class="empty-state"><strong>No leads yet</strong>' +
        'Leads appear here as soon as someone completes the funnel on one of your ' +
        '<a href="/admin/trackinglinks/">tracking links</a>.</div>';
      return;
    }

    leadsWrap.innerHTML =
      '<div class="table-wrap"><table><thead><tr>' +
      "<th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Timeline</th>" +
      "<th>Condition</th><th>Link</th><th>When</th><th></th>" +
      "</tr></thead><tbody>" +
      leads.map(function (lead) {
        return "<tr>" +
          "<td><strong>" + esc(lead.fullName) + "</strong></td>" +
          "<td>" + esc(formatPhone(lead.phone)) + "</td>" +
          "<td>" + (lead.email ? esc(lead.email) : '<span class="muted">—</span>') + "</td>" +
          "<td>" + esc(lead.address) + "</td>" +
          "<td>" + esc(lead.timeline) + "</td>" +
          "<td>" + esc(lead.condition) + "</td>" +
          "<td>" + (lead.linkSlug ? '<span class="pill">' + esc(lead.linkSlug) + "</span>" : '<span class="muted">direct</span>') + "</td>" +
          '<td class="muted">' + esc(formatDate(lead.createdAt)) + "</td>" +
          '<td><button type="button" class="btn btn-danger btn-small" data-delete="' + lead.id + '">Delete</button></td>' +
          "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  leadsWrap.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-delete]");
    if (!btn) return;
    if (confirm("Delete this lead? This can't be undone.")) {
      StarzeyStore.deleteLead(btn.dataset.delete).then(function () {
        showToast("Lead deleted");
        return refresh();
      }).catch(function (err) {
        showToast(err.message || "Couldn't delete the lead");
      });
    }
  });

  /* ---------- CSV export ---------- */
  document.getElementById("exportCsv").addEventListener("click", function () {
    var leads = allLeads;
    if (leads.length === 0) {
      showToast("No leads to export");
      return;
    }

    var columns = ["fullName", "phone", "email", "address", "timeline", "agent",
                   "reason", "condition", "occupancy", "linkSlug", "createdAt"];

    function cell(value) {
      var text = value == null ? "" : String(value);
      return '"' + text.replace(/"/g, '""') + '"';
    }

    var csv = columns.join(",") + "\n" +
      leads.map(function (lead) {
        return columns.map(function (col) { return cell(lead[col]); }).join(",");
      }).join("\n");

    var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "starzey-leads-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("CSV downloaded");
  });

  document.getElementById("signOut").addEventListener("click", function () {
    StarzeyStore.signOut();
  });

  /* Auth guard: redirects to /admin/login/ when signed out. */
  StarzeyStore.requireAuth().then(function () {
    document.body.classList.remove("auth-loading");
    return refresh();
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
