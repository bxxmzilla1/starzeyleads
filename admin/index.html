<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Starzey Admin</title>
<meta name="theme-color" content="#EEF5FB">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="auth-loading">
<div class="app">

  <aside class="sidebar">
    <a class="logo" href="/admin/" aria-label="Starzey admin home">
      <span class="logo-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E86D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5.5h4v5.5"/>
        </svg>
      </span>
      <span class="logo-name">Starzey</span>
    </a>

    <nav class="nav" aria-label="Admin sections">
      <a href="/admin/" class="active" aria-current="page">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="/admin/trackinglinks/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        Tracking links
      </a>
      <a href="/admin/landingpage/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        Landing page
      </a>
      <a href="/admin/leads/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Leads
      </a>
      <a href="/admin/settings/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
      <button type="button" id="signOut">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </nav>

    <div class="sidebar-foot">
      Public page: <a href="/" target="_blank" rel="noopener">starzey.com</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>Dashboard</h1>
      <p>A quick look at how your tracking links and lead funnel are performing.</p>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <div class="stat-label">Tracking links</div>
        <div class="stat-value" id="statLinks">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total visits</div>
        <div class="stat-value" id="statVisits">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Leads captured</div>
        <div class="stat-value" id="statLeads">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Conversion rate</div>
        <div class="stat-value" id="statConversion">—</div>
      </div>
    </div>

    <div class="card">
      <h2>Recent leads</h2>
      <div id="recentLeadsWrap"></div>
    </div>

    <div class="card">
      <h2>Top tracking links</h2>
      <div id="topLinksWrap"></div>
    </div>
  </main>
</div>

<script src="/api/config"></script>
<script src="/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/store.js"></script>
<script>
(function () {
  "use strict";

  function esc(text) {
    var div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
  }

  function formatDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " · " + new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  /* Full country name from an ISO code, e.g. "PH" -> "Philippines". */
  var regionNames = null;
  try { regionNames = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}

  function countryName(code) {
    if (!code) return "";
    if (regionNames) {
      try { return regionNames.of(code.toUpperCase()) || code; } catch (e) { return code; }
    }
    return code;
  }

  function render(links, leads) {

  var totalVisits = links.reduce(function (sum, l) { return sum + (l.visits || 0); }, 0);

  document.getElementById("statLinks").textContent = links.length;
  document.getElementById("statVisits").textContent = totalVisits;
  document.getElementById("statLeads").textContent = leads.length;
  document.getElementById("statConversion").textContent =
    totalVisits > 0 ? Math.round((leads.length / totalVisits) * 100) + "%" : "—";

  function leadsForSlug(slug) {
    return leads.filter(function (l) { return l.linkSlug === slug; }).length;
  }

  /* Recent leads (latest 5) */
  var recentWrap = document.getElementById("recentLeadsWrap");
  var recent = leads.slice().reverse().slice(0, 5);

  if (recent.length === 0) {
    recentWrap.innerHTML =
      '<div class="empty-state"><strong>No leads yet</strong>' +
      'Share a tracking link to start collecting home valuation leads.</div>';
  } else {
    recentWrap.innerHTML =
      '<div class="table-wrap"><table><thead><tr>' +
      "<th>Name</th><th>Phone</th><th>Location</th><th>Link</th><th>When</th>" +
      "</tr></thead><tbody>" +
      recent.map(function (lead) {
        var loc = [lead.city, countryName(lead.country)].filter(Boolean).join(", ");
        return "<tr>" +
          "<td><strong>" + esc(lead.fullName) + "</strong></td>" +
          "<td>" + esc(lead.phone) + "</td>" +
          "<td>" + (loc ? esc(loc) : '<span class="muted">—</span>') + "</td>" +
          "<td>" + (lead.linkSlug ? '<span class="pill">' + esc(lead.linkSlug) + "</span>" : '<span class="muted">direct</span>') + "</td>" +
          '<td class="muted">' + esc(formatDate(lead.createdAt)) + "</td>" +
          "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  /* Top links by visits */
  var topWrap = document.getElementById("topLinksWrap");

  if (links.length === 0) {
    topWrap.innerHTML =
      '<div class="empty-state"><strong>No tracking links yet</strong>' +
      'Create your first link in the <a href="/admin/trackinglinks/">Tracking links</a> section.</div>';
  } else {
    var sorted = links.slice().sort(function (a, b) { return (b.visits || 0) - (a.visits || 0); }).slice(0, 5);
    topWrap.innerHTML =
      '<div class="table-wrap"><table><thead><tr>' +
      "<th>Name</th><th>Slug</th><th>Visits</th><th>Leads</th><th>Conversion</th>" +
      "</tr></thead><tbody>" +
      sorted.map(function (link) {
        var linkLeads = leadsForSlug(link.slug);
        var conv = link.visits > 0 ? Math.round((linkLeads / link.visits) * 100) + "%" : "—";
        return "<tr>" +
          "<td><strong>" + esc(link.name) + "</strong></td>" +
          '<td><span class="pill">' + esc(link.slug) + "</span></td>" +
          "<td>" + (link.visits || 0) + "</td>" +
          "<td>" + linkLeads + "</td>" +
          "<td>" + conv + "</td>" +
          "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  }

  /* Re-renders only when data actually changed, so the 1-second
     live refresh never flickers. */
  var lastSnapshot = null;

  function refresh() {
    return Promise.all([
      StarzeyStore.getLinks(),
      StarzeyStore.getLeads()
    ]).then(function (results) {
      var snapshot = JSON.stringify(results);
      if (snapshot === lastSnapshot) return;
      lastSnapshot = snapshot;
      render(results[0], results[1]);
    });
  }

  /* Auth guard: redirects to /admin/login/ when signed out. */
  StarzeyStore.requireAuth().then(function () {
    document.body.classList.remove("auth-loading");
    return refresh();
  }).then(function () {
    /* Live stats: re-pull every second while the tab is visible. */
    var refreshing = false;
    setInterval(function () {
      if (document.hidden || refreshing) return;
      refreshing = true;
      refresh().catch(function () {}).then(function () { refreshing = false; });
    }, 1000);
  });

  document.getElementById("signOut").addEventListener("click", function () {
    StarzeyStore.signOut();
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
